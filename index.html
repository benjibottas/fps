<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lightweight FPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; touch-action: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* UI Overlay Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Interactive Menus */
        .interactive-menu { pointer-events: auto; }
        
        /* Laser Fade Animation */
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        /* CS2 HUD Styles */
        .cs-hud-panel { background: rgba(0, 0, 0, 0.4); border-radius: 4px; padding: 10px 20px; font-family: 'Arial', sans-serif; border: 1px solid rgba(255,255,255,0.05); }
        .cs-text-yellow { color: #e5c573; }
    </style>
</head>
<body class="text-white selection:bg-transparent">

    <!-- 3D Canvas Container -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between p-6 pointer-events-none z-10">
        
        <!-- Top HUD: Map & Killfeed (Visual Placeholders) -->
        <div id="hud-top" class="flex justify-between items-start w-full hidden">
            <div class="w-48 h-48 bg-black/40 rounded-full border-2 border-white/20 relative overflow-hidden flex items-center justify-center">
                <span class="text-white/30 text-xs font-mono">RADAR OFFLINE</span>
            </div>
            <div id="fps-counter" class="bg-black/50 text-green-400 px-3 py-1 rounded text-sm font-mono backdrop-blur-sm border border-white/10">FPS: 0</div>
        </div>

        <!-- Bottom HUD: Health & Ammo -->
        <div id="hud-bottom" class="flex justify-between items-end w-full hidden pb-4 px-8">
            <!-- Health & Armor -->
            <div class="flex gap-4 items-end">
                <div class="cs-hud-panel flex items-baseline gap-2">
                    <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd"></path></svg>
                    <span id="health-val" class="text-5xl font-bold cs-text-yellow drop-shadow-md">100</span>
                </div>
                <div class="cs-hud-panel flex items-baseline gap-2 opacity-80">
                    <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    <span class="text-3xl font-bold text-gray-100 drop-shadow-md">100</span>
                </div>
                <div id="player-status" class="text-sm bg-black/50 px-3 py-1 rounded text-gray-300 hidden mb-2 ml-4">Multiplayer Sync Active</div>
            </div>

            <!-- Ammo -->
            <div class="cs-hud-panel flex items-baseline gap-2">
                <span id="ammo-val" class="text-5xl font-bold cs-text-yellow drop-shadow-md">30</span>
                <span id="ammo-reserve" class="text-2xl text-gray-400 font-bold">/ 90</span>
            </div>
        </div>

        <div id="crosshair" class="hidden"></div>
        
        <!-- Reloading Indicator -->
        <div id="reload-indicator" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 mt-16 text-white font-bold tracking-widest hidden">RELOADING...</div>

        <!-- Damage Overlay -->
        <div id="damage-overlay" class="absolute inset-0 bg-red-600/30 opacity-0 transition-opacity duration-100 pointer-events-none z-0"></div>

        <!-- Main Menu -->
        <div id="main-menu" class="interactive-menu absolute inset-0 flex flex-col items-center justify-center bg-gray-900/95 backdrop-blur-md z-50 transition-opacity duration-300">
            <h1 class="text-6xl font-black italic tracking-tighter mb-2 text-transparent bg-clip-text bg-gradient-to-br from-yellow-400 to-orange-600 drop-shadow-lg">CS:LITE</h1>
            <p class="text-gray-400 mb-12 text-sm tracking-widest">TACTICAL FPS WEBGL</p>
            
            <div class="flex flex-col gap-4 w-64">
                <button id="btn-singleplayer" class="group relative px-6 py-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl transition-all duration-200 overflow-hidden">
                    <span class="relative z-10 font-bold text-lg group-hover:text-white">Play Offline (Bots)</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-orange-500 to-yellow-600 translate-y-full group-hover:translate-y-0 transition-transform duration-300 z-0"></div>
                </button>
                <button id="btn-multiplayer" class="group relative px-6 py-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl transition-all duration-200 overflow-hidden">
                    <span class="relative z-10 font-bold text-lg group-hover:text-white">Play Online</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-yellow-600 to-red-600 translate-y-full group-hover:translate-y-0 transition-transform duration-300 z-0"></div>
                </button>
            </div>
            <p id="loading-text" class="mt-8 text-yellow-400 font-mono text-sm hidden animate-pulse">Initializing...</p>
        </div>

        <!-- Weapon Select Menu -->
        <div id="weapon-menu" class="interactive-menu absolute inset-0 flex flex-col items-center justify-center bg-gray-900/95 backdrop-blur-md z-40 hidden transition-opacity duration-300">
            <h2 class="text-4xl font-bold mb-8 text-white tracking-widest">CHOOSE YOUR LOADOUT</h2>
            <div class="flex gap-6 w-full max-w-4xl px-4">
                <button class="weapon-btn flex-1 bg-black/40 hover:bg-white/10 border border-white/20 p-6 rounded-lg text-left transition-all group hover:-translate-y-1" data-weapon="pistol">
                    <h3 class="text-2xl font-bold text-gray-200 group-hover:text-white mb-2">Glock-18</h3>
                    <p class="text-sm text-gray-400 mb-4">Semi-Auto Pistol</p>
                    <div class="text-xs text-gray-500 space-y-1">
                        <p>Damage: Low (15)</p>
                        <p>Fire Rate: Fast</p>
                        <p>Clip: 20</p>
                    </div>
                </button>
                <button class="weapon-btn flex-1 bg-black/40 hover:bg-white/10 border border-white/20 p-6 rounded-lg text-left transition-all group border-b-4 border-b-yellow-500 hover:-translate-y-1" data-weapon="rifle">
                    <h3 class="text-2xl font-bold text-gray-200 group-hover:text-white mb-2">AK-47</h3>
                    <p class="text-sm text-gray-400 mb-4">Automatic Assault Rifle</p>
                    <div class="text-xs text-gray-500 space-y-1">
                        <p>Damage: High (35)</p>
                        <p>Fire Rate: Very Fast</p>
                        <p>Clip: 30</p>
                    </div>
                </button>
                <button class="weapon-btn flex-1 bg-black/40 hover:bg-white/10 border border-white/20 p-6 rounded-lg text-left transition-all group border-b-4 border-b-green-500 hover:-translate-y-1" data-weapon="sniper">
                    <h3 class="text-2xl font-bold text-gray-200 group-hover:text-white mb-2">AWP</h3>
                    <p class="text-sm text-gray-400 mb-4">Bolt-Action Sniper</p>
                    <div class="text-xs text-gray-500 space-y-1">
                        <p>Damage: Lethal (115)</p>
                        <p>Fire Rate: Slow</p>
                        <p>Clip: 10</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- Pause / Respawn Menu -->
        <div id="pause-menu" class="interactive-menu absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm z-40 hidden">
            <h2 id="pause-title" class="text-4xl font-bold mb-6 text-white">GAME PAUSED</h2>
            <p class="text-gray-400 mb-8">Click to resume or press ESC</p>
            <div class="flex flex-col gap-4 w-64">
                <button id="btn-resume" class="px-8 py-3 bg-yellow-600 hover:bg-yellow-500 text-black rounded font-bold transition-colors shadow-[0_0_15px_rgba(202,138,4,0.5)] w-full">RESUME / RESPAWN</button>
                <button id="btn-settings" class="px-8 py-3 bg-gray-800 hover:bg-gray-700 rounded font-bold transition-colors border border-gray-600 w-full text-white shadow-lg">SETTINGS</button>
            </div>
        </div>

        <!-- Settings Menu -->
        <div id="settings-menu" class="interactive-menu absolute inset-0 flex flex-col items-center justify-center bg-gray-900/95 backdrop-blur-md z-50 hidden transition-opacity duration-300 text-white">
            <h2 class="text-4xl font-bold mb-8 tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500">SETTINGS</h2>
            <div class="w-80 space-y-6">
                <div>
                    <label class="flex justify-between text-sm text-gray-400 mb-2"><span>Field of View</span> <span id="fov-display">75</span></label>
                    <input type="range" id="setting-fov" min="60" max="110" value="75" class="w-full accent-yellow-500 cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Max FPS Limit</label>
                    <select id="setting-fps" class="w-full bg-black/50 border border-gray-700 text-white p-3 rounded outline-none focus:border-yellow-500 cursor-pointer">
                        <option value="0">Unlimited</option>
                        <option value="120">120 FPS</option>
                        <option value="60">60 FPS</option>
                        <option value="30">30 FPS</option>
                    </select>
                </div>
                <label class="flex items-center gap-3 p-3 bg-black/30 border border-gray-800 rounded cursor-pointer hover:bg-black/50 transition">
                    <input type="checkbox" id="setting-showfps" checked class="w-5 h-5 accent-yellow-500 cursor-pointer">
                    <span class="text-sm font-bold">Show FPS Counter</span>
                </label>
                <button id="btn-close-settings" class="mt-8 px-8 py-3 bg-yellow-600 hover:bg-yellow-500 text-black rounded font-bold transition-colors w-full shadow-[0_0_15px_rgba(202,138,4,0.3)]">APPLY & BACK</button>
            </div>
        </div>
    </div>

    <!-- Required Three.js libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    
    <!-- Game Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // --- Game State ---
        const GAME_MODES = { MENU: 0, SINGLEPLAYER: 1, MULTIPLAYER: 2 };
        let currentMode = GAME_MODES.MENU;
        let isDead = false;
        let myHealth = 100;
        let pendingMode = null; // Store chosen mode while selecting weapon
        
        // --- Weapon System ---
        const WEAPONS = {
            pistol: { id: 'pistol', name: 'Glock-18', damage: 15, fireRate: 200, auto: false, clipSize: 20, reloadTime: 1200, color: 0xaaaaaa, spread: 0.02 },
            rifle: { id: 'rifle', name: 'AK-47', damage: 35, fireRate: 110, auto: true, clipSize: 30, reloadTime: 2000, color: 0xffd700, spread: 0.05 },
            sniper: { id: 'sniper', name: 'AWP', damage: 115, fireRate: 1500, auto: false, clipSize: 10, reloadTime: 3500, color: 0x228b22, spread: 0.002 }
        };
        let currentWeapon = WEAPONS.rifle;
        let ammoInClip = currentWeapon.clipSize;
        let ammoReserve = currentWeapon.clipSize * 3;
        let lastFireTime = 0;
        let isReloading = false;
        let isMouseDown = false;
        
        // --- Three.js Globals ---
        let scene, camera, renderer, controls;
        const objects = []; // For collision detection (walls)
        const shootableObjects = []; // Bots and Players
        
        // --- Movement Variables ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const playerSpeed = 400.0;
        const jumpVelocity = 35.0;

        // --- Settings & Viewmodel Variables ---
        let targetFps = 0;
        let lastRenderTime = 0;
        let gunMesh;
        const gunBasePosition = new THREE.Vector3(0.4, -0.3, -0.6); // Bottom right relative to camera

        // --- Bot Variables (Singleplayer) ---
        const bots = [];
        const botCount = 5;
        const botSpeed = 15;

        // --- Multiplayer Variables ---
        let app, db, auth, userId, playersRef;
        const remotePlayers = {}; // Track other players
        let lastSyncTime = 0;
        const syncInterval = 100; // ms between position syncs

        // --- Raycaster & Visuals ---
        let raycaster;
        const lasers = [];

        // --- UI Elements ---
        const ui = {
            mainMenu: document.getElementById('main-menu'),
            weaponMenu: document.getElementById('weapon-menu'),
            pauseMenu: document.getElementById('pause-menu'),
            settingsMenu: document.getElementById('settings-menu'),
            hudTop: document.getElementById('hud-top'),
            hudBottom: document.getElementById('hud-bottom'),
            crosshair: document.getElementById('crosshair'),
            healthVal: document.getElementById('health-val'),
            ammoVal: document.getElementById('ammo-val'),
            ammoReserve: document.getElementById('ammo-reserve'),
            reloadInd: document.getElementById('reload-indicator'),
            fpsCounter: document.getElementById('fps-counter'),
            btnSingle: document.getElementById('btn-singleplayer'),
            btnMulti: document.getElementById('btn-multiplayer'),
            btnResume: document.getElementById('btn-resume'),
            btnSettings: document.getElementById('btn-settings'),
            btnCloseSettings: document.getElementById('btn-close-settings'),
            weaponBtns: document.querySelectorAll('.weapon-btn'),
            loadingText: document.getElementById('loading-text'),
            pauseTitle: document.getElementById('pause-title'),
            damageOverlay: document.getElementById('damage-overlay'),
            playerStatus: document.getElementById('player-status')
        };

        let frames = 0;
        let lastFpsTime = performance.now();

        function initEngine() {
            // Scene setup - Urban Theme Sky/Atmosphere
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002); // Urban haze matching sky

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 10;

            // Renderer setup (Optimized for performance)
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Limit pixel ratio to save fill rate
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Controls setup - THREE.PointerLockControls is now globally defined
            controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());
            scene.add(camera); // Crucial for rendering attached children like the viewmodel

            // Raycaster for shooting
            raycaster = new THREE.Raycaster();

            // Setup Map
            generateMap();

            // Setup Viewmodel Gun
            createViewModel();

            // Event Listeners
            setupEventListeners();
            
            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function generateMap() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(2000, 2000, 10, 10);
            // Rotate geometry to save matrix updates later
            floorGeo.rotateX(-Math.PI / 2); 
            
            // Urban concrete ground
            const solidFloorMat = new THREE.MeshBasicMaterial({ color: 0x4a4a4a });
            const solidFloor = new THREE.Mesh(floorGeo, solidFloorMat);
            scene.add(solidFloor);

            // Obstacles / Walls - Buildings
            const wallColors = [0x555555, 0x666666, 0x777777, 0x3a3a3a, 0x8899aa]; // Concrete & glass-ish

            // Create random buildings, ensuring center is clear
            for (let i = 0; i < 80; i++) {
                const width = 20 + Math.random() * 40;
                const depth = 20 + Math.random() * 40;
                const height = 40 + Math.random() * 100; // Tall buildings

                const boxGeo = new THREE.BoxGeometry(width, height, depth);
                const matColor = wallColors[Math.floor(Math.random() * wallColors.length)];
                const boxMat = new THREE.MeshBasicMaterial({ color: matColor });
                const box = new THREE.Mesh(boxGeo, boxMat);
                
                // Random position
                box.position.x = Math.floor(Math.random() * 30 - 15) * 40;
                box.position.y = height / 2; // Sit exactly on floor
                box.position.z = Math.floor(Math.random() * 30 - 15) * 40;
                
                // Keep center clear for spawn
                if (Math.abs(box.position.x) < 80 && Math.abs(box.position.z) < 80) continue;

                // Update matrix manually and disable auto-update for static objects to boost FPS
                box.updateMatrix();
                box.matrixAutoUpdate = false;

                scene.add(box);
                objects.push(box); // Add to collision array
            }
        }

        function createHumanoidModel(colorHex) {
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            group.userData.originalColor = colorHex;

            const addPart = (w, h, d, y, x = 0, z = 0) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat.clone());
                mesh.position.set(x, y, z);
                group.add(mesh);
                return mesh;
            };

            // Total height 14, origin at y=0
            addPart(3, 3, 3, 12.5); // Head
            addPart(6, 5, 3, 8.5);  // Body
            addPart(2.5, 6, 2.5, 3, -2); // Left Leg
            addPart(2.5, 6, 2.5, 3, 2);  // Right Leg
            addPart(2, 5, 2, 8.5, -4);   // Left Arm
            addPart(2, 5, 2, 8.5, 4);    // Right Arm

            return group;
        }

        function createViewModel() {
            const gunGroup = new THREE.Group();
            
            // Base barrel/body
            const barrelGeo = new THREE.BoxGeometry(0.08, 0.1, 0.4);
            const barrelMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.position.set(0, 0, -0.1);
            gunGroup.add(barrel);
            
            // Grip
            const gripGeo = new THREE.BoxGeometry(0.06, 0.15, 0.08);
            const gripMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const grip = new THREE.Mesh(gripGeo, gripMat);
            grip.position.set(0, -0.1, 0.05);
            grip.rotation.x = Math.PI / 8;
            gunGroup.add(grip);

            // Set Initial Position attached to camera frame
            gunGroup.position.copy(gunBasePosition);
            
            camera.add(gunGroup); 
            gunMesh = gunGroup;
        }

        function updateGunModel(weaponId) {
            if(!gunMesh) return;
            const barrel = gunMesh.children[0];
            
            // Reset transforms
            barrel.scale.set(1, 1, 1);
            barrel.position.set(0, 0, -0.1);
            
            // Dynamically scale based on chosen gun
            if (weaponId === 'pistol') {
                barrel.scale.set(0.8, 0.8, 0.5); // Shorter
                barrel.position.z = 0;
            } else if (weaponId === 'sniper') {
                barrel.scale.set(1.2, 1.2, 2.5); // Much longer
                barrel.position.z = -0.4;
            }
        }

        function setupEventListeners() {
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump) velocity.y += jumpVelocity; canJump = false; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', (event) => {
                onKeyDown(event);
                // Reload binding
                if (event.code === 'KeyR' && controls.isLocked && !isDead && !isReloading) {
                    reloadWeapon();
                }
            });
            document.addEventListener('keyup', onKeyUp);
            
            // Shooting
            document.addEventListener('mousedown', (e) => {
                if (controls.isLocked && !isDead && e.button === 0) {
                    isMouseDown = true;
                    // For semi-auto weapons, trigger immediately on click
                    if (!currentWeapon.auto) {
                        attemptShoot();
                    }
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (e.button === 0) isMouseDown = false;
            });

            // Pointer Lock events
            controls.addEventListener('lock', function () {
                ui.pauseMenu.classList.add('hidden');
                ui.mainMenu.classList.add('hidden');
                ui.weaponMenu.classList.add('hidden');
                ui.hudTop.classList.remove('hidden');
                ui.hudBottom.classList.remove('hidden');
                ui.crosshair.classList.remove('hidden');
            });

            let lockCooldown = false;
            controls.addEventListener('unlock', function () {
                if (currentMode !== GAME_MODES.MENU) {
                    isMouseDown = false; // Reset mouse state
                    ui.pauseTitle.innerText = isDead ? "YOU DIED" : "GAME PAUSED";
                    ui.pauseMenu.classList.remove('hidden');
                    ui.hudTop.classList.add('hidden');
                    ui.hudBottom.classList.add('hidden');
                    ui.crosshair.classList.add('hidden');

                    // Modern browsers enforce a mandatory ~1.2s cooldown after exiting pointer lock
                    lockCooldown = true;
                    ui.btnResume.classList.add('opacity-50', 'pointer-events-none');
                    setTimeout(() => {
                        lockCooldown = false;
                        ui.btnResume.classList.remove('opacity-50', 'pointer-events-none');
                    }, 1200);
                }
            });

            // Menu Buttons - Requesting lock directly in click handler fixes the "nothing happens" issue
            ui.btnSingle.addEventListener('click', () => {
                pendingMode = GAME_MODES.SINGLEPLAYER;
                ui.mainMenu.classList.add('hidden');
                ui.weaponMenu.classList.remove('hidden');
            });
            
            ui.btnMulti.addEventListener('click', () => {
                pendingMode = GAME_MODES.MULTIPLAYER;
                ui.mainMenu.classList.add('hidden');
                ui.weaponMenu.classList.remove('hidden');
            });

            // Weapon Selection Flow
            ui.weaponBtns.forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const weaponId = e.currentTarget.getAttribute('data-weapon');
                    currentWeapon = WEAPONS[weaponId];
                    ammoInClip = currentWeapon.clipSize;
                    ammoReserve = currentWeapon.clipSize * 3;
                    updateAmmoUI();
                    updateGunModel(weaponId); // Scale the 3D gun
                    
                    if (pendingMode === GAME_MODES.SINGLEPLAYER) {
                        startGame(GAME_MODES.SINGLEPLAYER);
                        controls.lock(); 
                    } else if (pendingMode === GAME_MODES.MULTIPLAYER) {
                        ui.weaponMenu.classList.add('hidden');
                        ui.mainMenu.classList.remove('hidden');
                        ui.loadingText.classList.remove('hidden');
                        ui.loadingText.innerText = "Connecting to Secure Servers...";
                        ui.btnSingle.classList.add('hidden');
                        ui.btnMulti.classList.add('hidden');
                        
                        try {
                            await initMultiplayer();
                            currentMode = GAME_MODES.MULTIPLAYER;
                            respawn();
                            
                            ui.mainMenu.classList.add('hidden');
                            ui.pauseTitle.innerText = "SERVER CONNECTED";
                            ui.btnResume.innerText = "CLICK TO DEPLOY";
                            ui.pauseMenu.classList.remove('hidden');
                        } catch (error) {
                            console.error("Multiplayer Init Error:", error);
                            ui.loadingText.innerText = "Connection Failed.";
                            ui.btnSingle.classList.remove('hidden');
                            ui.btnMulti.classList.remove('hidden');
                        }
                    }
                });
            });
            
            ui.btnResume.addEventListener('click', () => {
                if (lockCooldown) return;
                if (isDead) respawn();
                controls.lock();
            });

            // Settings Listeners
            ui.btnSettings.addEventListener('click', () => {
                ui.pauseMenu.classList.add('hidden');
                ui.settingsMenu.classList.remove('hidden');
            });
            
            ui.btnCloseSettings.addEventListener('click', () => {
                ui.settingsMenu.classList.add('hidden');
                ui.pauseMenu.classList.remove('hidden');
            });

            document.getElementById('setting-fov').addEventListener('input', (e) => {
                const fov = parseInt(e.target.value);
                document.getElementById('fov-display').innerText = fov;
                camera.fov = fov;
                camera.updateProjectionMatrix();
            });

            document.getElementById('setting-fps').addEventListener('change', (e) => {
                targetFps = parseInt(e.target.value);
            });

            document.getElementById('setting-showfps').addEventListener('change', (e) => {
                if (e.target.checked) {
                    ui.hudTop.querySelector('#fps-counter').style.opacity = "1";
                } else {
                    ui.hudTop.querySelector('#fps-counter').style.opacity = "0";
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateAmmoUI() {
            ui.ammoVal.innerText = ammoInClip;
            ui.ammoReserve.innerText = `/ ${ammoReserve}`;
            if (ammoInClip <= currentWeapon.clipSize * 0.25) {
                ui.ammoVal.classList.add('text-red-500');
                ui.ammoVal.classList.remove('cs-text-yellow');
            } else {
                ui.ammoVal.classList.remove('text-red-500');
                ui.ammoVal.classList.add('cs-text-yellow');
            }
        }

        function reloadWeapon() {
            if (ammoInClip === currentWeapon.clipSize || ammoReserve <= 0 || isReloading) return;
            isReloading = true;
            ui.reloadInd.classList.remove('hidden');
            
            setTimeout(() => {
                if (isDead) { isReloading = false; ui.reloadInd.classList.add('hidden'); return; }
                const needed = currentWeapon.clipSize - ammoInClip;
                const toReload = Math.min(needed, ammoReserve);
                ammoInClip += toReload;
                ammoReserve -= toReload;
                isReloading = false;
                ui.reloadInd.classList.add('hidden');
                updateAmmoUI();
            }, currentWeapon.reloadTime);
        }

        function attemptShoot() {
            if (isReloading || isDead) return;
            const now = performance.now();
            if (now - lastFireTime < currentWeapon.fireRate) return;
            
            if (ammoInClip <= 0) {
                reloadWeapon();
                return;
            }

            lastFireTime = now;
            ammoInClip--;
            updateAmmoUI();
            shootWeapon();
        }

        function shootWeapon() {
            // Raycast from center of camera
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            // Apply weapon spread
            const spread = currentWeapon.spread;
            raycaster.ray.direction.x += (Math.random() - 0.5) * spread;
            raycaster.ray.direction.y += (Math.random() - 0.5) * spread;
            raycaster.ray.direction.z += (Math.random() - 0.5) * spread;
            raycaster.ray.direction.normalize();

            // Visual Laser Origin (slightly offset below/right of camera)
            const laserStart = new THREE.Vector3();
            camera.getWorldPosition(laserStart);
            const offset = new THREE.Vector3(0.5, -0.5, -1);
            offset.applyQuaternion(camera.quaternion);
            laserStart.add(offset);

            // Check intersections against walls and entities (recursive to hit humanoid parts)
            const allTargets = [...objects, ...shootableObjects];
            const intersects = raycaster.intersectObjects(allTargets, true);

            let endPoint = new THREE.Vector3();
            let hitEntity = null;

            if (intersects.length > 0) {
                const hit = intersects[0];
                endPoint.copy(hit.point);
                
                // Check if hit object is an entity (bot or player)
                if (hit.object.userData && hit.object.userData.isEntity) {
                    hitEntity = hit.object;
                }
            } else {
                // Shoot into distance
                raycaster.ray.at(500, endPoint);
            }

            // Draw Laser
            drawLaser(laserStart, endPoint, true);

            // Viewmodel Recoil Animation Trigger
            if (gunMesh) {
                gunMesh.position.z = gunBasePosition.z + 0.15; // Kick back physically
                gunMesh.rotation.x = 0.2; // Pitch barrel upwards
            }

            // Apply Damage Logic
            if (hitEntity) {
                handleHit(hitEntity);
            }

            // Multiplayer Sync: Send Shoot Event
            if (currentMode === GAME_MODES.MULTIPLAYER && userId) {
                // In a robust game, we'd sync shoot events via DB or WebRTC. 
                // Here, to save DB writes and adhere to constraints, we'll let the shooter resolve the hit and update the victim's health directly.
            }
        }

        function drawLaser(start, end, isPlayer) {
            // Player laser matches weapon color, enemies are red
            const color = isPlayer ? currentWeapon.color : 0xff0000;
            const material = new THREE.MeshBasicMaterial({ color: color });
            const distance = start.distanceTo(end);
            
            // Use BoxGeometry for thicker laser, better visibility
            const geometry = new THREE.BoxGeometry(0.2, 0.2, distance);
            const laser = new THREE.Mesh(geometry, material);
            
            // Position halfway between start and end
            laser.position.copy(start).lerp(end, 0.5);
            // Look at end point
            laser.lookAt(end);
            
            scene.add(laser);
            lasers.push({ mesh: laser, spawnTime: performance.now(), lifespan: 100 });
        }

        function handleHit(entityMesh) {
            const entity = entityMesh.userData.rootEntity || entityMesh;

            if (entity.userData.type === 'bot') {
                entity.userData.health -= currentWeapon.damage;
                
                // Flash hit (loop through all humanoid body parts)
                if (entity.children && entity.children.length > 0) {
                    entity.children.forEach(c => c.material && c.material.color.setHex(0xffffff));
                    setTimeout(() => { if (entity) entity.children.forEach(c => c.material && c.material.color.setHex(entity.userData.originalColor || 0xff3333)); }, 100);
                } else {
                    entity.material.color.setHex(0xffffff);
                    setTimeout(() => { if (entity && entity.material) entity.material.color.setHex(0xff3333); }, 100);
                }

                if (entity.userData.health <= 0) {
                    // Respawn bot randomly
                    respawnBot(entity);
                }
            } else if (entity.userData.type === 'player' && currentMode === GAME_MODES.MULTIPLAYER) {
                // We hit another multiplayer user - Flash hit
                if (entity.children && entity.children.length > 0) {
                    entity.children.forEach(c => c.material && c.material.color.setHex(0xffffff));
                    setTimeout(() => { if (entity) entity.children.forEach(c => c.material && c.material.color.setHex(entity.userData.originalColor || 0x3388ff)); }, 100);
                }

                const targetId = entity.userData.id;
                // We directly update their health in the DB
                if (remotePlayers[targetId]) {
                    const newHealth = Math.max(0, remotePlayers[targetId].health - currentWeapon.damage);
                    // Update their doc
                    updateDoc(doc(playersRef, targetId), {
                        health: newHealth,
                        lastHitTime: Date.now()
                    }).catch(e => console.error("Hit sync error", e));
                }
            }
        }

        function takeDamage(amount) {
            if (isDead) return;
            
            myHealth -= amount;
            
            // Flash screen red
            ui.damageOverlay.style.opacity = '1';
            setTimeout(() => { ui.damageOverlay.style.opacity = '0'; }, 150);

            // Update UI Health
            ui.healthVal.innerText = Math.max(0, Math.floor(myHealth));
            if (myHealth <= 20) {
                ui.healthVal.classList.add('text-red-500');
                ui.healthVal.classList.remove('cs-text-yellow');
            }

            if (myHealth <= 0) {
                die();
            }
            
            // Sync own health if multiplayer
            if (currentMode === GAME_MODES.MULTIPLAYER && userId) {
                updateDoc(doc(playersRef, userId), { health: myHealth });
            }
        }

        function die() {
            isDead = true;
            controls.unlock();
            ui.pauseTitle.innerText = "YOU DIED";
            ui.btnResume.innerText = "RESPAWN";
        }

        function respawn() {
            isDead = false;
            myHealth = 100;
            ui.healthVal.innerText = '100';
            ui.healthVal.classList.remove('text-red-500');
            ui.healthVal.classList.add('cs-text-yellow');
            ui.btnResume.innerText = "RESUME";
            
            // Reset Ammo
            ammoInClip = currentWeapon.clipSize;
            ammoReserve = currentWeapon.clipSize * 3;
            isReloading = false;
            ui.reloadInd.classList.add('hidden');
            updateAmmoUI();

            // Random spawn point away from center slightly
            const angle = Math.random() * Math.PI * 2;
            const radius = 50 + Math.random() * 100;
            controls.getObject().position.set(Math.cos(angle) * radius, 10, Math.sin(angle) * radius);
            
            // Reset velocity
            velocity.set(0,0,0);

            if (currentMode === GAME_MODES.MULTIPLAYER && userId) {
                updateDoc(doc(playersRef, userId), { health: myHealth });
            }
        }

        function initSinglePlayerBots() {
            for (let i = 0; i < botCount; i++) {
                const bot = createHumanoidModel(0xff3333);
                scene.add(bot);
                
                bot.userData = {
                    isEntity: true,
                    type: 'bot',
                    health: 100,
                    lastShot: performance.now() + Math.random() * 2000, // random stagger
                    state: 'patrol',
                    targetPos: new THREE.Vector3()
                };
                
                // Map children back to parent for raycaster hit resolution
                bot.children.forEach(child => {
                    child.userData = bot.userData;
                    child.userData.rootEntity = bot;
                });

                respawnBot(bot);
                bots.push(bot);
                shootableObjects.push(bot);
            }
        }

        function respawnBot(bot) {
            bot.userData.health = 100;
            // Spawn far away on ground level
            bot.position.set(
                (Math.random() - 0.5) * 400,
                0, // ground level
                (Math.random() - 0.5) * 400
            );
            bot.userData.targetPos.copy(bot.position);
        }

        function updateBots(delta) {
            const playerPos = controls.getObject().position;
            const now = performance.now();

            bots.forEach(bot => {
                const distToPlayer = bot.position.distanceTo(playerPos);
                
                // Simple AI: Face player, move towards if far, stop and shoot if near
                bot.lookAt(playerPos.x, bot.position.y, playerPos.z);

                if (distToPlayer > 100 && distToPlayer < 350) {
                    // Move towards player
                    const dir = playerPos.clone().sub(bot.position).normalize();
                    bot.position.add(dir.multiplyScalar(botSpeed * delta));
                }

                // Raycast to check Line of Sight
                if (distToPlayer < 350) {
                    // Quick raycast
                    const rayOrigin = bot.position.clone();
                    rayOrigin.y += 10; // Check from upper body
                    const dirToPlayer = playerPos.clone().sub(rayOrigin).normalize();
                    raycaster.set(rayOrigin, dirToPlayer);
                    const hit = raycaster.intersectObjects(objects); // Only check walls
                    
                    let hasLoS = true;
                    if (hit.length > 0 && hit[0].distance < distToPlayer) {
                        hasLoS = false; // Wall in the way
                    }

                    if (hasLoS && !isDead) {
                        // CS2 Bot Nerf: Delayed reaction time & slower fire rate
                        if (!bot.userData.seeingPlayerSince) {
                            bot.userData.seeingPlayerSince = now;
                        } else if (now - bot.userData.seeingPlayerSince > 800) { // 800ms reaction delay
                            if (now - bot.userData.lastShot > 1500) { // Fire every 1.5s maximum
                                bot.userData.lastShot = now + (Math.random() * 500); // add variance
                                botShoot(bot, playerPos);
                            }
                        }
                    } else {
                        bot.userData.seeingPlayerSince = 0; // Reset vision timer if line of sight broken
                    }
                } else {
                    bot.userData.seeingPlayerSince = 0; // Reset vision timer if out of range
                }
            });
        }

        function botShoot(bot, playerPos) {
            // Visuals
            const start = bot.position.clone();
            start.y += 10; // Shoot from upper body
            
            // Heavy Inaccuracy for bots
            const end = playerPos.clone();
            end.x += (Math.random() - 0.5) * 40;
            end.y += (Math.random() - 0.5) * 40;
            end.z += (Math.random() - 0.5) * 40;
            
            drawLaser(start, end, false);

            // Hit logic
            const dist = start.distanceTo(end);
            
            // If random end point is close to player, count as hit (Forgiving hitbox)
            if (end.distanceTo(playerPos) < 25) {
                takeDamage(12); // Reduced bot damage
            }
        }

        async function initMultiplayer() {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'arena-lite-default';
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                
                let firebaseConfig = {};
                try {
                    firebaseConfig = JSON.parse(configStr);
                } catch (e) {
                    console.warn("No valid firebase config parsed", e);
                }

                if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                    throw new Error("No Firebase configuration supplied.");
                }
                
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authentication (Mandatory before Firestore usage)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await signInWithCustomToken(auth, __initial_auth_token);
                    userId = cred.user.uid;
                } else {
                    const cred = await signInAnonymously(auth);
                    userId = cred.user.uid;
                }

                // Setup paths
                playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'players');

                // Initial Document Creation
                const spawnPos = controls.getObject().position;
                await setDoc(doc(playersRef, userId), {
                    x: spawnPos.x, y: spawnPos.y, z: spawnPos.z,
                    ry: camera.rotation.y,
                    health: 100,
                    lastUpdate: Date.now()
                });

                // Listen for other players
                setupMultiplayerListeners();
                
                ui.playerStatus.classList.remove('hidden');
                startGame(GAME_MODES.MULTIPLAYER);

            } catch (error) {
                console.error("Multiplayer Init Error:", error);
                ui.loadingText.innerText = "Multiplayer requires Firebase config. You can play Single Player mode!";
                ui.btnSingle.classList.remove('hidden');
                ui.btnMulti.classList.remove('hidden');
            }
        }

        function setupMultiplayerListeners() {
            // No complex queries allowed, fetch all players and handle locally
            onSnapshot(playersRef, (snapshot) => {
                const now = Date.now();
                snapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const id = docSnapshot.id;

                    // Skip self
                    if (id === userId) {
                        // Check if I took damage from another player
                        if (data.health < myHealth && data.health >= 0) {
                            takeDamage(myHealth - data.health);
                        }
                        return;
                    }
                    
                    // Cleanup inactive players (> 10 seconds since update)
                    if (now - data.lastUpdate > 10000) {
                        removeRemotePlayer(id);
                        return;
                    }

                    if (!remotePlayers[id]) {
                        createRemotePlayer(id, data);
                    } else {
                        updateRemotePlayer(id, data);
                    }
                });
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        function createRemotePlayer(id, data) {
            const mesh = createHumanoidModel(0x3388ff);
            mesh.position.set(data.x, data.y, data.z);
            mesh.rotation.y = data.ry;
            
            mesh.userData = {
                isEntity: true,
                type: 'player',
                id: id
            };

            // Map children back to parent for raycaster hit resolution
            mesh.children.forEach(child => {
                child.userData = mesh.userData;
                child.userData.rootEntity = mesh;
            });

            scene.add(mesh);
            shootableObjects.push(mesh);

            remotePlayers[id] = {
                mesh: mesh,
                targetPos: new THREE.Vector3(data.x, data.y, data.z),
                targetRot: data.ry,
                health: data.health
            };
        }

        function updateRemotePlayer(id, data) {
            const rp = remotePlayers[id];
            // Update target positions for lerping in render loop
            rp.targetPos.set(data.x, data.y, data.z);
            rp.targetRot = data.ry;
            rp.health = data.health;
            
            // Visual feedback if they died
            if (rp.health <= 0) {
                rp.mesh.visible = false;
            } else {
                rp.mesh.visible = true;
            }
        }

        function removeRemotePlayer(id) {
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id].mesh);
                const idx = shootableObjects.indexOf(remotePlayers[id].mesh);
                if (idx > -1) shootableObjects.splice(idx, 1);
                delete remotePlayers[id];
            }
        }

        function syncMultiplayerState() {
            if (!userId) return;
            const now = Date.now();
            if (now - lastSyncTime > syncInterval) {
                lastSyncTime = now;
                const pos = controls.getObject().position;
                
                // Only send necessary data
                updateDoc(doc(playersRef, userId), {
                    x: Number(pos.x.toFixed(2)),
                    y: Number(pos.y.toFixed(2)),
                    z: Number(pos.z.toFixed(2)),
                    ry: Number(camera.rotation.y.toFixed(2)),
                    lastUpdate: now
                }).catch(e => {}); // Silent catch to prevent console spam on intermittent network
            }
        }

        function startGame(mode) {
            currentMode = mode;
            
            if (mode === GAME_MODES.SINGLEPLAYER) {
                initSinglePlayerBots();
                ui.playerStatus.classList.add('hidden');
                respawn();
            }
            
            prevTime = performance.now();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            
            // FPS Limiter implementation
            if (targetFps > 0) {
                const elapsed = time - lastRenderTime;
                if (elapsed < (1000 / targetFps)) return; // Skip rendering frame
            }
            lastRenderTime = time;

            const delta = Math.min((time - prevTime) / 1000, 0.1); // cap delta to prevent huge jumps
            
            if (currentMode === GAME_MODES.MENU) {
                // Rotate camera slowly around the scene for a dynamic menu background
                camera.position.x = Math.sin(time * 0.0002) * 200;
                camera.position.y = 150;
                camera.position.z = Math.cos(time * 0.0002) * 200;
                camera.lookAt(0, 0, 0);
                renderer.render(scene, camera);
                prevTime = time;
                return; // Skip game logic updates in menu
            }
            
            updateFPS(time);
            updateLasers();

            // Smooth Viewmodel Recoil Recovery Lerping
            if (gunMesh) {
                gunMesh.position.lerp(gunBasePosition, delta * 15.0);
                gunMesh.rotation.x = THREE.MathUtils.lerp(gunMesh.rotation.x, 0, delta * 15.0);
            }

            // Automatic Weapon Firing
            if (controls.isLocked && isMouseDown && currentWeapon.auto) {
                attemptShoot();
            }

            // Physics & Movement
            if (controls.isLocked && !isDead) {
                // Apply friction
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 12.0 * delta; // Gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * playerSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * playerSpeed * delta;

                // Move Controls
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                // Floor collision
                if (controls.getObject().position.y < 10) {
                    velocity.y = 0;
                    controls.getObject().position.y = 10;
                    canJump = true;
                }

                // Simple Boundary bounds
                const pos = controls.getObject().position;
                if (pos.x > 900) pos.x = 900;
                if (pos.x < -900) pos.x = -900;
                if (pos.z > 900) pos.z = 900;
                if (pos.z < -900) pos.z = -900;

                // Mode specific updates
                if (currentMode === GAME_MODES.SINGLEPLAYER) {
                    updateBots(delta);
                } else if (currentMode === GAME_MODES.MULTIPLAYER) {
                    syncMultiplayerState();
                }
            }

            // Always Lerp remote players for smooth rendering regardless of tick rate
            if (currentMode === GAME_MODES.MULTIPLAYER) {
                for (const id in remotePlayers) {
                    const rp = remotePlayers[id];
                    // Lerp position (10.0 * delta creates smooth interpolation regardless of framerate)
                    rp.mesh.position.lerp(rp.targetPos, 10.0 * delta);
                    
                    // Simple rotation slerp
                    const targetQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), rp.targetRot);
                    rp.mesh.quaternion.slerp(targetQuat, 10.0 * delta);
                }
            }

            renderer.render(scene, camera);
            prevTime = time;
        }

        function updateLasers() {
            const now = performance.now();
            for (let i = lasers.length - 1; i >= 0; i--) {
                const laser = lasers[i];
                const age = now - laser.spawnTime;
                if (age > laser.lifespan) {
                    scene.remove(laser.mesh);
                    laser.mesh.geometry.dispose();
                    lasers.splice(i, 1);
                } else {
                    // Fade out
                    laser.mesh.material.opacity = 1 - (age / laser.lifespan);
                    laser.mesh.material.transparent = true;
                }
            }
        }

        function updateFPS(now) {
            frames++;
            if (now >= lastFpsTime + 1000) {
                ui.fpsCounter.innerText = `FPS: ${Math.round((frames * 1000) / (now - lastFpsTime))}`;
                frames = 0;
                lastFpsTime = now;
            }
        }

        // Initialize 3D Engine immediately and start render loop
        initEngine();
        animate();

    </script>
