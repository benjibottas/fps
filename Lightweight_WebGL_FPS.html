<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lightweight FPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; touch-action: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* UI Overlay Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Interactive Menus */
        .interactive-menu { pointer-events: auto; }
        
        /* Laser Fade Animation */
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="text-white selection:bg-transparent">

    <!-- 3D Canvas Container -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="flex flex-col justify-between p-4">
        
        <!-- Top Bar: FPS & Health -->
        <div class="flex justify-between items-start w-full hidden" id="hud">
            <div id="fps-counter" class="bg-black/50 text-green-400 px-3 py-1 rounded text-sm font-mono backdrop-blur-sm border border-white/10">FPS: 0</div>
            <div class="flex flex-col items-end gap-2">
                <div class="bg-black/50 px-4 py-2 rounded flex items-center gap-3 backdrop-blur-sm border border-white/10">
                    <span class="text-sm text-gray-300 uppercase tracking-wider font-bold">Health</span>
                    <div class="w-32 h-4 bg-gray-800 rounded-full overflow-hidden">
                        <div id="health-bar" class="h-full bg-red-500 transition-all duration-200" style="width: 100%;"></div>
                    </div>
                </div>
                <div id="player-status" class="text-sm bg-black/50 px-3 py-1 rounded text-gray-300 hidden">Multiplayer Sync Active</div>
            </div>
        </div>

        <div id="crosshair" class="hidden"></div>
        
        <!-- Damage Overlay -->
        <div id="damage-overlay" class="absolute inset-0 bg-red-600/30 opacity-0 transition-opacity duration-100 pointer-events-none z-0"></div>

        <!-- Main Menu -->
        <div id="main-menu" class="interactive-menu absolute inset-0 flex flex-col items-center justify-center bg-gray-900/95 backdrop-blur-md z-50 transition-opacity duration-300">
            <h1 class="text-6xl font-black italic tracking-tighter mb-2 text-transparent bg-clip-text bg-gradient-to-br from-blue-400 to-purple-600 drop-shadow-lg">ARENA.LITE</h1>
            <p class="text-gray-400 mb-12 text-sm tracking-widest">HIGH PERFORMANCE FPS</p>
            
            <div class="flex flex-col gap-4 w-64">
                <button id="btn-singleplayer" class="group relative px-6 py-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl transition-all duration-200 overflow-hidden">
                    <span class="relative z-10 font-bold text-lg group-hover:text-white">Single Player</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-500 to-blue-600 translate-y-full group-hover:translate-y-0 transition-transform duration-300 z-0"></div>
                </button>
                <button id="btn-multiplayer" class="group relative px-6 py-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl transition-all duration-200 overflow-hidden">
                    <span class="relative z-10 font-bold text-lg group-hover:text-white">Multiplayer</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-purple-500 to-purple-600 translate-y-full group-hover:translate-y-0 transition-transform duration-300 z-0"></div>
                </button>
            </div>
            <p id="loading-text" class="mt-8 text-yellow-400 font-mono text-sm hidden animate-pulse">Initializing Environment...</p>
        </div>

        <!-- Pause / Respawn Menu -->
        <div id="pause-menu" class="interactive-menu absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm z-40 hidden">
            <h2 id="pause-title" class="text-4xl font-bold mb-6 text-white">GAME PAUSED</h2>
            <p class="text-gray-400 mb-8">Click to resume or press ESC</p>
            <button id="btn-resume" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded font-bold transition-colors shadow-[0_0_15px_rgba(37,99,235,0.5)]">RESUME / RESPAWN</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        import { PointerLockControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/PointerLockControls.js';
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Game State ---
        const GAME_MODES = { MENU: 0, SINGLEPLAYER: 1, MULTIPLAYER: 2 };
        let currentMode = GAME_MODES.MENU;
        let isDead = false;
        let myHealth = 100;
        
        // --- Three.js Globals ---
        let scene, camera, renderer, controls;
        const objects = []; // For collision detection (walls)
        const shootableObjects = []; // Bots and Players
        
        // --- Movement Variables ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const playerSpeed = 400.0;
        const jumpVelocity = 35.0;

        // --- Bot Variables (Singleplayer) ---
        const bots = [];
        const botCount = 5;
        const botSpeed = 15;

        // --- Multiplayer Variables ---
        let app, db, auth, userId, playersRef;
        const remotePlayers = {}; // Track other players
        let lastSyncTime = 0;
        const syncInterval = 100; // ms between position syncs

        // --- Raycaster & Visuals ---
        let raycaster;
        const laserMaterials = {
            player: new THREE.MeshBasicMaterial({ color: 0x00ffff }),
            enemy: new THREE.MeshBasicMaterial({ color: 0xff0000 })
        };
        const lasers = [];

        // --- UI Elements ---
        const ui = {
            mainMenu: document.getElementById('main-menu'),
            pauseMenu: document.getElementById('pause-menu'),
            hud: document.getElementById('hud'),
            crosshair: document.getElementById('crosshair'),
            healthBar: document.getElementById('health-bar'),
            fpsCounter: document.getElementById('fps-counter'),
            btnSingle: document.getElementById('btn-singleplayer'),
            btnMulti: document.getElementById('btn-multiplayer'),
            btnResume: document.getElementById('btn-resume'),
            loadingText: document.getElementById('loading-text'),
            pauseTitle: document.getElementById('pause-title'),
            damageOverlay: document.getElementById('damage-overlay'),
            playerStatus: document.getElementById('player-status')
        };

        let frames = 0;
        let lastFpsTime = performance.now();

        function initEngine() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111115);
            scene.fog = new THREE.Fog(0x111115, 0, 750);

            // Lighting (Optimized: Minimal lights, no shadows)
            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight.position.set(100, 100, 50);
            scene.add(dirLight);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 10;

            // Renderer setup (Optimized for performance)
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Limit pixel ratio to save fill rate
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Controls setup
            controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            // Raycaster for shooting
            raycaster = new THREE.Raycaster();

            // Setup Map
            generateMap();

            // Event Listeners
            setupEventListeners();
            
            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function generateMap() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(2000, 2000, 10, 10);
            // Rotate geometry to save matrix updates later
            floorGeo.rotateX(-Math.PI / 2); 
            
            // Basic grid material (very fast to render)
            const floorMat = new THREE.MeshBasicMaterial({ 
                color: 0x222225, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.3 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            scene.add(floor);

            const solidFloorMat = new THREE.MeshLambertMaterial({ color: 0x0a0a0c });
            const solidFloor = new THREE.Mesh(floorGeo, solidFloorMat);
            solidFloor.position.y = -0.1; // Slightly below wireframe
            scene.add(solidFloor);

            // Obstacles / Walls
            const boxGeo = new THREE.BoxGeometry(20, 20, 20);
            const boxMat = new THREE.MeshLambertMaterial({ color: 0x3a3a45 });

            // Create random boxes, ensuring center is clear
            for (let i = 0; i < 150; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                
                // Random position
                box.position.x = Math.floor(Math.random() * 20 - 10) * 40;
                box.position.y = 10; // Half height
                box.position.z = Math.floor(Math.random() * 20 - 10) * 40;
                
                // Keep center clear for spawn
                if (Math.abs(box.position.x) < 60 && Math.abs(box.position.z) < 60) continue;

                // Random scale
                box.scale.x = Math.random() * 2 + 0.5;
                box.scale.y = Math.random() * 2 + 0.5;
                box.scale.z = Math.random() * 2 + 0.5;
                
                // Random rotation
                box.rotation.y = Math.random() * Math.PI;
                
                // Update matrix manually and disable auto-update for static objects to boost FPS
                box.updateMatrix();
                box.matrixAutoUpdate = false;

                scene.add(box);
                objects.push(box); // Add to collision array
            }
        }

        function setupEventListeners() {
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump) velocity.y += jumpVelocity; canJump = false; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            
            // Shooting
            document.addEventListener('mousedown', (e) => {
                if (controls.isLocked && !isDead) {
                    shootWeapon();
                }
            });

            // Pointer Lock events
            controls.addEventListener('lock', function () {
                ui.pauseMenu.classList.add('hidden');
                ui.hud.classList.remove('hidden');
                ui.crosshair.classList.remove('hidden');
            });

            controls.addEventListener('unlock', function () {
                if (currentMode !== GAME_MODES.MENU) {
                    ui.pauseTitle.innerText = isDead ? "YOU DIED" : "GAME PAUSED";
                    ui.pauseMenu.classList.remove('hidden');
                    ui.hud.classList.add('hidden');
                    ui.crosshair.classList.add('hidden');
                }
            });

            // Menu Buttons
            ui.btnSingle.addEventListener('click', () => startGame(GAME_MODES.SINGLEPLAYER));
            ui.btnMulti.addEventListener('click', () => startGame(GAME_MODES.MULTIPLAYER));
            ui.btnResume.addEventListener('click', () => {
                if (isDead) respawn();
                controls.lock();
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function shootWeapon() {
            // Raycast from center of camera
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            // Visual Laser Origin (slightly offset below/right of camera)
            const laserStart = new THREE.Vector3();
            camera.getWorldPosition(laserStart);
            const offset = new THREE.Vector3(0.5, -0.5, -1);
            offset.applyQuaternion(camera.quaternion);
            laserStart.add(offset);

            // Check intersections against walls and entities
            const allTargets = [...objects, ...shootableObjects];
            const intersects = raycaster.intersectObjects(allTargets);

            let endPoint = new THREE.Vector3();
            let hitEntity = null;

            if (intersects.length > 0) {
                const hit = intersects[0];
                endPoint.copy(hit.point);
                
                // Check if hit object is an entity (bot or player)
                if (hit.object.userData && hit.object.userData.isEntity) {
                    hitEntity = hit.object;
                }
            } else {
                // Shoot into distance
                raycaster.ray.at(500, endPoint);
            }

            // Draw Laser
            drawLaser(laserStart, endPoint, true);

            // Apply Damage Logic
            if (hitEntity) {
                handleHit(hitEntity);
            }

            // Multiplayer Sync: Send Shoot Event
            if (currentMode === GAME_MODES.MULTIPLAYER && userId) {
                // In a robust game, we'd sync shoot events via DB or WebRTC. 
                // Here, to save DB writes and adhere to constraints, we'll let the shooter resolve the hit and update the victim's health directly.
            }
        }

        function drawLaser(start, end, isPlayer) {
            const material = isPlayer ? laserMaterials.player : laserMaterials.enemy;
            const distance = start.distanceTo(end);
            
            // Use BoxGeometry for thicker laser, better visibility
            const geometry = new THREE.BoxGeometry(0.2, 0.2, distance);
            const laser = new THREE.Mesh(geometry, material);
            
            // Position halfway between start and end
            laser.position.copy(start).lerp(end, 0.5);
            // Look at end point
            laser.lookAt(end);
            
            scene.add(laser);
            
            // Store for fade/removal
            lasers.push({
                mesh: laser,
                spawnTime: performance.now(),
                lifespan: 100 // ms
            });
        }

        function handleHit(entity) {
            if (entity.userData.type === 'bot') {
                entity.userData.health -= 35;
                // Flash hit
                entity.material.color.setHex(0xffffff);
                setTimeout(() => { if (entity && entity.material) entity.material.color.setHex(0xff3333); }, 100);

                if (entity.userData.health <= 0) {
                    // Respawn bot randomly
                    respawnBot(entity);
                }
            } else if (entity.userData.type === 'player' && currentMode === GAME_MODES.MULTIPLAYER) {
                // We hit another multiplayer user
                const targetId = entity.userData.id;
                // We directly update their health in the DB
                if (remotePlayers[targetId]) {
                    const newHealth = Math.max(0, remotePlayers[targetId].health - 25);
                    // Update their doc
                    updateDoc(doc(playersRef, targetId), {
                        health: newHealth,
                        lastHitTime: Date.now()
                    }).catch(e => console.error("Hit sync error", e));
                }
            }
        }

        function takeDamage(amount) {
            if (isDead) return;
            
            myHealth -= amount;
            
            // Flash screen red
            ui.damageOverlay.style.opacity = '1';
            setTimeout(() => { ui.damageOverlay.style.opacity = '0'; }, 150);

            // Update UI
            ui.healthBar.style.width = `${Math.max(0, myHealth)}%`;

            if (myHealth <= 0) {
                die();
            }
            
            // Sync own health if multiplayer
            if (currentMode === GAME_MODES.MULTIPLAYER && userId) {
                updateDoc(doc(playersRef, userId), { health: myHealth });
            }
        }

        function die() {
            isDead = true;
            controls.unlock();
            ui.pauseTitle.innerText = "YOU DIED";
            ui.btnResume.innerText = "RESPAWN";
        }

        function respawn() {
            isDead = false;
            myHealth = 100;
            ui.healthBar.style.width = '100%';
            ui.btnResume.innerText = "RESUME";
            
            // Random spawn point away from center slightly
            const angle = Math.random() * Math.PI * 2;
            const radius = 50 + Math.random() * 100;
            controls.getObject().position.set(Math.cos(angle) * radius, 10, Math.sin(angle) * radius);
            
            // Reset velocity
            velocity.set(0,0,0);

            if (currentMode === GAME_MODES.MULTIPLAYER && userId) {
                updateDoc(doc(playersRef, userId), { health: myHealth });
            }
        }

        function initSinglePlayerBots() {
            const botGeo = new THREE.BoxGeometry(8, 16, 8);
            const botMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });

            for (let i = 0; i < botCount; i++) {
                const bot = new THREE.Mesh(botGeo, botMat.clone());
                scene.add(bot);
                
                bot.userData = {
                    isEntity: true,
                    type: 'bot',
                    health: 100,
                    lastShot: performance.now() + Math.random() * 2000, // random stagger
                    state: 'patrol',
                    targetPos: new THREE.Vector3()
                };
                
                respawnBot(bot);
                bots.push(bot);
                shootableObjects.push(bot);
            }
        }

        function respawnBot(bot) {
            bot.userData.health = 100;
            // Spawn far away
            bot.position.set(
                (Math.random() - 0.5) * 400,
                8, // half height
                (Math.random() - 0.5) * 400
            );
            bot.userData.targetPos.copy(bot.position);
        }

        function updateBots(delta) {
            const playerPos = controls.getObject().position;
            const now = performance.now();

            bots.forEach(bot => {
                const distToPlayer = bot.position.distanceTo(playerPos);
                
                // Simple AI: Face player, move towards if far, stop and shoot if near
                bot.lookAt(playerPos.x, bot.position.y, playerPos.z);

                if (distToPlayer > 80 && distToPlayer < 300) {
                    // Move towards player
                    const dir = playerPos.clone().sub(bot.position).normalize();
                    bot.position.add(dir.multiplyScalar(botSpeed * delta));
                }

                // Raycast to check Line of Sight
                if (distToPlayer < 200 && now - bot.userData.lastShot > 1500) {
                    // Quick raycast
                    const dirToPlayer = playerPos.clone().sub(bot.position).normalize();
                    raycaster.set(bot.position, dirToPlayer);
                    const hit = raycaster.intersectObjects(objects); // Only check walls
                    
                    let hasLoS = true;
                    if (hit.length > 0 && hit[0].distance < distToPlayer) {
                        hasLoS = false; // Wall in the way
                    }

                    if (hasLoS && !isDead) {
                        bot.userData.lastShot = now + (Math.random() * 500); // add variance
                        botShoot(bot, playerPos);
                    }
                }
            });
        }

        function botShoot(bot, playerPos) {
            // Visuals
            const start = bot.position.clone();
            // Inaccuracy
            const end = playerPos.clone();
            end.x += (Math.random() - 0.5) * 10;
            end.y += (Math.random() - 0.5) * 10;
            end.z += (Math.random() - 0.5) * 10;
            
            drawLaser(start, end, false);

            // Hit logic
            const dist = start.distanceTo(end);
            const exactDist = start.distanceTo(playerPos);
            
            // If random end point is close to player, count as hit
            if (end.distanceTo(playerPos) < 15) {
                takeDamage(20);
            }
        }

        async function initMultiplayer() {
            ui.loadingText.classList.remove('hidden');
            ui.loadingText.innerText = "Connecting to Secure Servers...";
            ui.btnSingle.classList.add('hidden');
            ui.btnMulti.classList.add('hidden');

            try {
                // Initialize Firebase Using Required Environment Config
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'arena-lite-default';
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                
                let firebaseConfig = {};
                try {
                    firebaseConfig = JSON.parse(configStr);
                } catch(e) {
                    console.warn("No valid firebase config found, running locally only");
                }
                
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authentication (Mandatory before Firestore usage)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await signInWithCustomToken(auth, __initial_auth_token);
                    userId = cred.user.uid;
                } else {
                    const cred = await signInAnonymously(auth);
                    userId = cred.user.uid;
                }

                // Setup paths exactly as requested
                playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'players');

                // Initial Document Creation
                const spawnPos = controls.getObject().position;
                await setDoc(doc(playersRef, userId), {
                    x: spawnPos.x, y: spawnPos.y, z: spawnPos.z,
                    ry: camera.rotation.y,
                    health: 100,
                    lastUpdate: Date.now()
                });

                // Listen for other players
                setupMultiplayerListeners();
                
                ui.playerStatus.classList.remove('hidden');
                startGame(GAME_MODES.MULTIPLAYER);

            } catch (error) {
                console.error("Multiplayer Init Error:", error);
                ui.loadingText.innerText = "Connection Failed. Try Singleplayer.";
                ui.btnSingle.classList.remove('hidden');
            }
        }

        function setupMultiplayerListeners() {
            // No complex queries allowed, fetch all players and handle locally
            onSnapshot(playersRef, (snapshot) => {
                const now = Date.now();
                snapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const id = docSnapshot.id;

                    // Skip self
                    if (id === userId) {
                        // Check if I took damage from another player
                        if (data.health < myHealth && data.health >= 0) {
                            takeDamage(myHealth - data.health);
                        }
                        return;
                    }
                    
                    // Cleanup inactive players (> 10 seconds since update)
                    if (now - data.lastUpdate > 10000) {
                        removeRemotePlayer(id);
                        return;
                    }

                    if (!remotePlayers[id]) {
                        createRemotePlayer(id, data);
                    } else {
                        updateRemotePlayer(id, data);
                    }
                });
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        function createRemotePlayer(id, data) {
            const geo = new THREE.BoxGeometry(8, 16, 8);
            const mat = new THREE.MeshLambertMaterial({ color: 0x3388ff }); // Blue players
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.position.set(data.x, data.y, data.z);
            mesh.rotation.y = data.ry;
            
            mesh.userData = {
                isEntity: true,
                type: 'player',
                id: id
            };

            scene.add(mesh);
            shootableObjects.push(mesh);

            remotePlayers[id] = {
                mesh: mesh,
                targetPos: new THREE.Vector3(data.x, data.y, data.z),
                targetRot: data.ry,
                health: data.health
            };
        }

        function updateRemotePlayer(id, data) {
            const rp = remotePlayers[id];
            // Update target positions for lerping in render loop
            rp.targetPos.set(data.x, data.y, data.z);
            rp.targetRot = data.ry;
            rp.health = data.health;
            
            // Visual feedback if they died
            if (rp.health <= 0) {
                rp.mesh.visible = false;
            } else {
                rp.mesh.visible = true;
            }
        }

        function removeRemotePlayer(id) {
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id].mesh);
                const idx = shootableObjects.indexOf(remotePlayers[id].mesh);
                if (idx > -1) shootableObjects.splice(idx, 1);
                delete remotePlayers[id];
            }
        }

        function syncMultiplayerState() {
            if (!userId) return;
            const now = Date.now();
            if (now - lastSyncTime > syncInterval) {
                lastSyncTime = now;
                const pos = controls.getObject().position;
                
                // Only send necessary data
                updateDoc(doc(playersRef, userId), {
                    x: Number(pos.x.toFixed(2)),
                    y: Number(pos.y.toFixed(2)),
                    z: Number(pos.z.toFixed(2)),
                    ry: Number(camera.rotation.y.toFixed(2)),
                    lastUpdate: now
                }).catch(e => {}); // Silent catch to prevent console spam on intermittent network
            }
        }

        function startGame(mode) {
            ui.mainMenu.classList.add('hidden');
            currentMode = mode;
            
            if (mode === GAME_MODES.SINGLEPLAYER) {
                initSinglePlayerBots();
                ui.playerStatus.classList.add('hidden');
            } else if (mode === GAME_MODES.MULTIPLAYER && !userId) {
                initMultiplayer();
                return; // startgame will be called again after init
            }
            
            respawn(); // setup initial pos
            controls.lock();
            prevTime = performance.now();
            animate();
        }

        function animate() {
            if (currentMode === GAME_MODES.MENU) return;
            
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1); // cap delta to prevent huge jumps
            
            updateFPS(time);
            updateLasers();

            // Physics & Movement
            if (controls.isLocked && !isDead) {
                // Apply friction
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 12.0 * delta; // Gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * playerSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * playerSpeed * delta;

                // Move Controls
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                // Floor collision
                if (controls.getObject().position.y < 10) {
                    velocity.y = 0;
                    controls.getObject().position.y = 10;
                    canJump = true;
                }

                // Simple Boundary bounds
                const pos = controls.getObject().position;
                if (pos.x > 900) pos.x = 900;
                if (pos.x < -900) pos.x = -900;
                if (pos.z > 900) pos.z = 900;
                if (pos.z < -900) pos.z = -900;

                // Mode specific updates
                if (currentMode === GAME_MODES.SINGLEPLAYER) {
                    updateBots(delta);
                } else if (currentMode === GAME_MODES.MULTIPLAYER) {
                    syncMultiplayerState();
                }
            }

            // Always Lerp remote players for smooth rendering regardless of tick rate
            if (currentMode === GAME_MODES.MULTIPLAYER) {
                for (const id in remotePlayers) {
                    const rp = remotePlayers[id];
                    // Lerp position (10.0 * delta creates smooth interpolation regardless of framerate)
                    rp.mesh.position.lerp(rp.targetPos, 10.0 * delta);
                    
                    // Simple rotation slerp
                    const targetQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), rp.targetRot);
                    rp.mesh.quaternion.slerp(targetQuat, 10.0 * delta);
                }
            }

            renderer.render(scene, camera);
            prevTime = time;
        }

        function updateLasers() {
            const now = performance.now();
            for (let i = lasers.length - 1; i >= 0; i--) {
                const laser = lasers[i];
                const age = now - laser.spawnTime;
                if (age > laser.lifespan) {
                    scene.remove(laser.mesh);
                    laser.mesh.geometry.dispose();
                    lasers.splice(i, 1);
                } else {
                    // Fade out
                    laser.mesh.material.opacity = 1 - (age / laser.lifespan);
                    laser.mesh.material.transparent = true;
                }
            }
        }

        function updateFPS(now) {
            frames++;
            if (now >= lastFpsTime + 1000) {
                ui.fpsCounter.innerText = `FPS: ${Math.round((frames * 1000) / (now - lastFpsTime))}`;
                frames = 0;
                lastFpsTime = now;
            }
        }

        // Initialize 3D Engine on Load
        window.onload = () => {
            initEngine();
        };

    </script>
</body>
